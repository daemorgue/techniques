name: Lint and test indexer parsing
run-name: Linting and testing indexer for ${{ github.head_ref }} on PR creation/modification
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
   lint_and_test_index:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Get list of report markdown files changed in PR
      id: changed-markdown-files
      uses: tj-actions/changed-files@24d32ffd492484c1d75e0c0b894501ddb9d30d62
      with:
        files: "reports/**/README.md"

    - name: Setup Go environment
      uses: actions/setup-go@v5.5.0
      with:
        go-version: '1.21'

    - name: Install dependencies
      run: go get github.com/yuin/goldmark

    - name: Run linter on changed files
      if: steps.changed-markdown-files.outputs.any_changed == 'true'
      run: go run tools/trrlint/main.go ${{ steps.changed-markdown-files.outputs.all_changed_files }}

    - name: Run linter on all files
      if: github.event_name == 'workflow_dispatch'
      run: go run tools/trrlint/main.go

    # tiredize (https://github.com/tired-labs/tiredize) is being phased in to
    # replace tools/trrlint. Until it reaches feature parity its findings are
    # reported but do not fail the job. Config lives in .github/tiredize/.
    - name: Setup Python environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install tiredize
      # No PyPI release yet; pinned to a commit because the finding taxonomy
      # is still changing upstream.
      run: pip install "git+https://github.com/tired-labs/tiredize.git@08aafe55f46b25820e7be5b46b391c2126d24cf0"

    - name: Run tiredize on changed files
      if: steps.changed-markdown-files.outputs.any_changed == 'true'
      continue-on-error: true
      run: >
        tiredize
        --markdown-schema .github/tiredize/markdown-schema.yaml
        --rules .github/tiredize/rules.yaml
        ${{ steps.changed-markdown-files.outputs.all_changed_files }}

    - name: Run tiredize on all files
      if: github.event_name == 'workflow_dispatch'
      continue-on-error: true
      run: >
        find docs/examples reports -name README.md -print0
        | xargs -0 tiredize
        --markdown-schema .github/tiredize/markdown-schema.yaml
        --rules .github/tiredize/rules.yaml

    - name: Validate indexer would pass
      if: steps.changed-markdown-files.outputs.all_any_changed == 'true'
      run: python3 tools/index/index.py merge -f ${{ steps.changed-markdown-files.outputs.all_all_changed_files }}
