# tiredize linter rules for TRRs. See docs/STYLE-GUIDE.md.
#
# These rules are reported but not yet blocking in CI (see
# .github/workflows/lint.yml). Style-guide rules tiredize cannot express yet
# (list and blockquote formatting, table contents, folder layout) are not
# enforced.

# "Lines should be wrapped at 80 characters" - exempt: tables, code blocks,
# long URLs (style guide), plus image lines, which cannot be wrapped.
line_length:
  maximum_length: 80
  exclude:
    - code_block
    - image_inline
    - reference_definition
    - table

# "Please use only global links ... in paragraphs." Rejects [text](url) and
# <http://...>. Bare URLs and email addresses (autolink_extended) are
# deliberately not disallowed.
elements:
  disallow:
    - autolink
    - link_inline
